name: DevOps End-to-End Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: \${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: \${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        id: tf
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
          echo "INSTANCE_IP=\$(terraform output -raw target_server_public_ip)" >> \$GITHUB_ENV

      - name: Set up SSH Private Key
        run: |
          echo "\${{ secrets.SSH_PRIVATE_KEY_NEW }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Run Ansible Playbook Configuration
        run: |
          cd ansible
          ansible-playbook -i inventory.ini -u ec2-user playbook.yml
